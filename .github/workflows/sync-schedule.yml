on:
  schedule:
    - cron: "0 2 * * *" # every day at 10:00 (UTC+8 = 2:00 UTC)
  workflow_dispatch: # allow manual triggering
name: Schedule / sync-upstream of Yikf's forked repositories
jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    
    - name: Install dependencies
      run: uv venv && uv pip install -e .
    
    - name: Sync spark and vllm
      run: uv run sync-upstream --token "${{ secrets.SYNC_UPSTREAM_TOKEN }}" --config config.yaml
