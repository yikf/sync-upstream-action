name: Run tests
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: Install dependencies with dev
      run: uv venv && uv pip install -e ".[dev]"
    - name: Run tests
      run: uv run pytest tests/ -v --cov=sync_upstream --cov-report=term --cov-report=xml
