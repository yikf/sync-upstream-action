name: 'Sync upstream repository'
author: 'Kaifei Yi'
description: 'Sync a fork of a repository to keep it up-to-date with the upstream repository.'
branding:
  icon: 'repeat'
  color: 'green'
inputs:
  token:
    description: 'The GitHub personal access token to use for authentication'
    required: true
  owner:
    description: 'The owner of the fork repositories'
    required: false
  repo:
    description: 'The name of a single fork repo (legacy mode)'
    required: false
  branch:
    description: 'The branch name for single repo mode'
    required: false
    default: 'master'
  config:
    description: 'Path to config file for advanced configuration'
    required: false
runs:
  using: 'docker'
  image: 'Dockerfile'
