# Example config.yaml
# GitHub personal access token (can also be set via GITHUB_TOKEN environment variable)
github_token: "your_personal_access_token_here"

# Repository owner (defaults to current user)
owner: "Yikf"

# Repository list (must be explicitly specified)
repositories:
  - name: "kyuubi"
    branches: ["master", "branch-1.8", "branch-1.9"]  # Specify branches, optional
  - name: "spark"  # If branches not specified, only sync default branch
  - name: "incubator-gluten"
