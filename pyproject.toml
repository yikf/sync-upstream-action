[project]
name = "sync-upstream"
version = "0.3.0"
description = "Sync your forked repositories with upstream"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "Apache-2.0"}
authors = [
    {name = "yikf"}
]
keywords = ["github", "sync", "upstream", "fork"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.25.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "pytest-cov>=4.1",
]

[project.scripts]
sync-upstream = "sync_upstream.main:main"

[project.urls]
Homepage = "https://github.com/yikf/sync-upstream-action"
Issues = "https://github.com/yikf/sync-upstream-action/issues"
Repository = "https://github.com/yikf/sync-upstream-action"

[tool.setuptools.packages.find]
where = ["."]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
